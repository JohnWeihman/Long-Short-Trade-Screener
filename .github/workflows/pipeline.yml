# Daily pipeline: refresh data, rebuild everything, publish for the web app.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SEC_USER_AGENT     your name and email, e.g. "Jane Doe jane@example.com" (required by the SEC)
#   ANTHROPIC_API_KEY  optional; without it memos are template-only and no API calls are made
#
# If any step fails, nothing is committed, so the site keeps the previous
# day's data, and GitHub emails you about the failed run.

name: Daily pipeline

on:
  schedule:
    - cron: "0 23 * * 1-5"   # 23:00 UTC, Monday to Friday, after the US close
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions:
  contents: write             # to commit published/

concurrency:
  group: pipeline
  cancel-in-progress: false   # never run two at once

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # Raw downloads (filing documents, prices) carried between runs. If the
      # cache is evicted, the pipeline simply downloads everything again.
      - name: Restore raw data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-${{ github.run_id }}
          restore-keys: raw-data-

      - name: Tests
        run: pytest -q

      - name: Pipeline
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Exit code 1 means "finished with problems" (for example a ticker the
        # SEC no longer lists): the results are still published. 2 or more
        # means a step could not run: fail, publish nothing.
        run: |
          set +e
          python -m screener.pipeline --publish
          code=$?
          set -e
          if [ "$code" -ge 2 ]; then exit "$code"; fi

      - name: Commit published data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          as_of=$(python -c 'import json; print(json.load(open("published/manifest.json"))["as_of"])')
          git commit -m "Publish data as of ${as_of}"
          git push
